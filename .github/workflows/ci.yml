name: build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet build ChatGPT.AuthIsland.sln -c Release
      - run: dotnet publish ChatGPT.AuthIsland/ChatGPT.AuthIsland.csproj -c Release --output dist
      - uses: actions/upload-artifact@v4
        with:
          name: ChatGPT.AuthIsland-win-x64
          path: dist/
